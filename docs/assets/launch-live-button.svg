<svg xmlns="http://www.w3.org/2000/svg" width="420" height="84" viewBox="0 0 420 84" fill="none">
  <defs>
    <!-- Ambient drop shadow & liquid cyan/lime aura -->
    <filter id="glassGlow" x="-15%" y="-30%" width="130%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#00E5FF" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#020617" flood-opacity="0.75" />
    </filter>

    <!-- Frosted dark glass base gradient -->
    <linearGradient id="glassBody" x1="16" y1="8" x2="404" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#132238" stop-opacity="0.88" />
      <stop offset="48%" stop-color="#0B1424" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#112536" stop-opacity="0.88" />
    </linearGradient>

    <!-- Liquid specular sheen across top surface -->
    <linearGradient id="liquidSheen" x1="40" y1="10" x2="360" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.34" />
      <stop offset="35%" stop-color="#3FD8FF" stop-opacity="0.16" />
      <stop offset="70%" stop-color="#C6FF2E" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>

    <!-- Refractive liquid glass rim border -->
    <linearGradient id="glassRim" x1="14" y1="10" x2="406" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7EE8FF" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#C6FF2E" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#3FD8FF" stop-opacity="0.75" />
    </linearGradient>

    <!-- Inner pill accent gradient -->
    <linearGradient id="ctaPill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C6FF2E" />
      <stop offset="100%" stop-color="#3FD8FF" />
    </linearGradient>

    <clipPath id="pillClip">
      <rect x="14" y="10" width="392" height="64" rx="32" />
    </clipPath>
  </defs>

  <!-- Outer refractive aura -->
  <rect x="14" y="10" width="392" height="64" rx="32" fill="url(#glassBody)" filter="url(#glassGlow)" />

  <!-- Internal caustic blobs for liquid glass depth -->
  <g clip-path="url(#pillClip)">
    <ellipse cx="92" cy="18" rx="115" ry="26" fill="#3FD8FF" fill-opacity="0.14" />
    <ellipse cx="332" cy="66" rx="110" ry="24" fill="#C6FF2E" fill-opacity="0.12" />
    <!-- Top curved glass highlight -->
    <path d="M26 24 C 95 11, 325 11, 394 24 L 394 12 L 26 12 Z" fill="url(#liquidSheen)" />
    <!-- Subtle inner bottom reflection -->
    <path d="M46 70 Q 210 64 374 70" stroke="#7EE8FF" stroke-opacity="0.28" stroke-width="1.2" fill="none" />
  </g>

  <!-- Specular glass rim -->
  <rect x="14" y="10" width="392" height="64" rx="32" stroke="url(#glassRim)" stroke-width="1.5" fill="none" />

  <!-- Live pulse indicator orb -->
  <circle cx="46" cy="42" r="10" fill="#C6FF2E" fill-opacity="0.18" />
  <circle cx="46" cy="42" r="5" fill="#C6FF2E" />
  <circle cx="44.5" cy="40.5" r="1.5" fill="#FFFFFF" fill-opacity="0.9" />

  <!-- Typography -->
  <text x="68" y="37" fill="#F8FAFC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" letter-spacing="0.4">
    Launch IndusMindAI Live
  </text>
  <text x="68" y="55" fill="#94A3B8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="500" letter-spacing="0.2">
    indusmindbd.vercel.app
  </text>

  <!-- Right frosted action badge -->
  <rect x="306" y="24" width="84" height="36" rx="18" fill="url(#ctaPill)" fill-opacity="0.96" />
  <text x="348" y="46.5" text-anchor="middle" fill="#0B1220" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="800" letter-spacing="0.6">
    OPEN ↗
  </text>
</svg>
